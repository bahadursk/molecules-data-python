name: Build and deploy book
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the PDF to this existing release tag (optional)"
        required: false
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python tools/build_book.py
      - name: Build the website
        run: jupyter-book build book
      - name: Build the PDF
        run: |
          jupyter-book build book --builder singlehtml
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/make_pdf.js
          cp book/_build/molecules-data-python.pdf book/_build/html/
      - uses: actions/upload-artifact@v4
        with:
          name: molecules-data-python-pdf
          path: book/_build/molecules-data-python.pdf
      - name: Attach the PDF to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" book/_build/molecules-data-python.pdf --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html
  deploy:
    needs: build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
